<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XPCompass</title>
<style>
  :root {
    --bg: #14110d; --panel: #1d1913; --line: #33291f; --line-2: #4a3e2e;
    --text: #ece4d4; --muted: #a59a86; --faint: #7a705e;
    --gold: #d8b45a; --gold-ink: #1b1508; --ok: #8fc48a; --wait: #e2b35c; --bad: #e08a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line-2);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
  button.link { border: none; padding: 0; color: var(--gold); }
  button.link:hover { text-decoration: underline; }
  button.icon-btn { border: none; padding: 2px 6px; color: var(--muted); font-size: 16px; }
  button.icon-btn:hover { color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header img { width: 32px; height: 32px; }
  header .title { font-size: 15px; font-weight: 600; }
  .chip { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .avatar img { width: 28px; height: 28px; }
  .avatar.crest { border: none; background: none; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line-2);
    display: grid; place-items: center; color: var(--gold); font-weight: 600; font-size: 12px; }
  .chip .name { font-size: 12.5px; line-height: 1.2; }
  .tag { font-size: 10.5px; color: var(--gold); letter-spacing: .3px; }
  main { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .top { display: flex; gap: 10px; align-items: center; }
  .ring { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--gold); flex: none;
    display: grid; place-items: center; color: var(--gold); font-weight: 700; font-size: 11px; }
  .ring.dim { border-color: var(--line-2); color: var(--faint); }
  .mark { width: 42px; height: 42px; flex: none; }
  .mark.small { width: 26px; height: 26px; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  .grow { flex: 1; min-width: 0; }
  .pill, button.update, button.chip-btn { display: inline-block; padding: 4px 12px; border-radius: 99px; border: 1px solid;
    font-size: 12px; line-height: 1.35; white-space: nowrap; }
  button.chip-btn { border-color: var(--line-2); color: var(--text); }
  button.chip-btn:hover { border-color: var(--gold); }
  .pill.ok { color: var(--ok); border-color: #4d6b49; }
  .pill.wait { color: var(--wait); border-color: #6e5a33; }
  .pill.bad { color: var(--bad); border-color: #6e4239; }
  .pill.dim { color: var(--faint); border-color: var(--line-2); }
  .bar { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--gold); transition: width .3s; }
  .bar.busy > div { width: 35% !important; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
  .progress { margin-top: 10px; }
  .progress .small { display: flex; justify-content: space-between; margin-top: 4px; }
  .meta { margin-top: 8px; font-size: 11.5px; color: var(--faint); }
  .meta .ver { font-family: Consolas, monospace; }
  .note { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .note.gold { color: var(--gold); }
  .notes { margin: 8px 0 0; padding-left: 16px; font-size: 12px; color: var(--text); }
  .line { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); color: var(--faint); }
  .small { font-size: 11.5px; color: var(--faint); }
  footer { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); }
  footer .text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer .bar { width: 90px; }
  .error { color: var(--bad); }
  .centre { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
  .centre h1 { font-size: 18px; font-weight: 600; margin: 10px 0 8px; }
  .centre p { color: var(--muted); margin: 0 0 16px; }
  .centre .primary { padding: 9px 22px; }
  .opts { display: grid; gap: 16px; }
  .opt .label { font-weight: 600; margin-bottom: 3px; }
  .path { font-family: Consolas, monospace; font-size: 11.5px; word-break: break-all; }
  label.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  button.update { border-color: var(--gold); color: var(--gold); }
  button.update:hover { background: var(--gold); color: var(--gold-ink); }
  .markbox { position: relative; flex: none; display: flex; }
  .markbox.dim { filter: grayscale(1) brightness(.6); }
  .badge { position: absolute; right: -5px; bottom: -5px; width: 21px; height: 21px;
    filter: drop-shadow(0 0 1.5px var(--panel)) drop-shadow(0 0 1.5px var(--panel)); }
  .markbox.small .badge { right: -4px; bottom: -4px; width: 14px; height: 14px;
    filter: drop-shadow(0 0 1px var(--bg)) drop-shadow(0 0 1px var(--bg)); }
  .modal { position: fixed; inset: 0; background: rgba(8, 6, 4, .78); display: flex; padding: 18px; }
  .sheet { margin: auto; width: 100%; max-height: 100%; background: var(--bg); border: 1px solid var(--line-2);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .sheet .head { display: flex; align-items: center; gap: 9px; padding: 14px 16px 8px; font-size: 16px; font-weight: 600; }
  .sheet .head img { width: 24px; height: 24px; }
  .sheet .body { overflow: auto; padding: 4px 16px 10px; }
  .rel-date { color: var(--faint); font-size: 12px; margin: 12px 0 6px; }
  .rel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .rel h3 { margin: 6px 0 4px; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--gold); }
  .rel ul { margin: 0 0 4px; padding-left: 18px; }
  .rel li { margin: 3px 0; }
  .sheet .foot { padding: 10px 16px 14px; text-align: center; }
  input[type=checkbox] { accent-color: var(--gold); width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
let last = "", view = "main", news = null;
// Each game's badge, drawn for XPCompass (not Blizzard's logos), pinned to the corner of its app's mark.
const BADGES = {
  "WoW Forever": `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#8a6a3a" stroke="#d8b45a" stroke-width="1"/>
    <circle cx="12" cy="12" r="8" fill="#16707c"/><circle cx="12" cy="12" r="8" fill="none" stroke="#0b3f47" stroke-width="1"/>
    <path d="M7.4 12c0-1.5 1.1-2.5 2.3-2.5 2.1 0 2.5 5 4.6 5 1.2 0 2.3-1 2.3-2.5s-1.1-2.5-2.3-2.5c-2.1 0-2.5 5-4.6 5-1.2 0-2.3-1-2.3-2.5z"
      fill="none" stroke="#e6f6f1" stroke-width="1.5"/></svg>`,
  "WoW Classic Era": `<svg viewBox="0 0 24 24"><path d="M12 1.5 21 4.6V11c0 5.4-3.9 9.4-9 11.5C6.9 20.4 3 16.4 3 11V4.6z" fill="#d8b45a"/>
    <path d="M12 4 18.6 6.3V11c0 4-2.8 7.1-6.6 8.8C8.2 18.1 5.4 15 5.4 11V6.3z" fill="#7a1f17"/>
    <path d="M9 7.5h6L12.6 12 15 16.5H9L11.4 12z" fill="#f1d58a"/></svg>`,
};

function mark(a, s, small) {
  const badge = BADGES[a.game];
  return `<span class="markbox ${small ? "small dim" : ""}"><img class="mark ${small ? "small" : ""}" src="${s.logo}" alt="">${
    badge ? `<span class="badge" title="${esc(a.game)}">${badge}</span>` : ""}</span>`;
}

// What the app is for, shown under its name: its game, then its edition.
function appLine(a) {
  return [BADGES[a.game] ? a.game : "", a.edition_name || a.about].filter(Boolean).map(esc).join(" · ");
}
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function header(s) {
  const who = s.signed_in
    ? `${s.member ? `<div class="avatar crest" title="Only Bans member"><img src="${s.crest}" alt=""></div>`
                  : `<div class="avatar">${esc((s.name || "?").slice(0, 1).toUpperCase())}</div>`}
       <div><div class="name">${esc(s.name || "Signed in")}</div>${s.member ? `<div class="tag">Only Bans member</div>` : ""}</div>`
    : (s.welcome || s.signin.busy ? "" : `<button class="link" data-act="sign_in">Sign in</button>`);
  return `<header><img src="${s.logo}" alt=""><span class="title">XPCompass</span>
    <div class="chip">${who}${s.welcome || s.signin.busy ? "" :
      `<button class="icon-btn" data-view="${view === "main" ? "options" : "main"}" title="Options">⚙</button>`}</div></header>`;
}

function pill(a) {
  return {current: `<span class="pill ok">Up to date</span>`, installed: `<span class="pill ok">Updated</span>`,
          waiting: `<button class="update" data-act="update_now" data-id="${a.id}" title="Install now; restart WoW after">Update now</button>`,
          pending: `<span class="pill dim">Checking</span>`,
          none: `<span class="pill dim">No build yet</span>`, error: `<span class="pill bad">Problem</span>`,
          downloading: "", installing: "", locked: `<span class="pill dim">Locked</span>`,
          paused: `<span class="pill dim">Paused</span>`,
          signin: `<button class="chip-btn" data-act="sign_in">Sign in</button>`}[a.state] ?? `<span class="pill dim">${esc(a.state)}</span>`;
}

function card(a, s) {
  if (!a.wanted) return `<div class="card"><div class="top">${mark(a, s)}
    <div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${appLine(a)}</div></div>
    <button class="chip-btn" data-act="set_wanted" data-id="${a.id}" data-on="1">Install</button></div></div>`;
  const busy = a.state === "downloading" || a.state === "installing";
  const pct = a.progress == null ? null : Math.round(a.progress * 100);
  return `<div class="card">
    <div class="top">${mark(a, s)}
      <div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${appLine(a)}${a.testing ? ` · <span class="tag">Testing build</span>` : ""}</div></div>
      ${pill(a)}</div>
    ${busy ? `<div class="progress"><div class="bar ${pct == null ? "busy" : ""}"><div style="width:${pct || 0}%"></div></div>
      <div class="small"><span>${a.state === "installing" ? "Installing…" : "Downloading…"}</span><span>${pct == null ? "" : pct + "%"}</span></div></div>` : ""}
    ${a.state === "error" || a.state === "locked" ? `<div class="note">${esc(a.text)}</div>` : ""}
    ${a.upgrade ? `<div class="note gold">${esc(a.upgrade.text)}</div>` : ""}
    <div class="meta">${versionLine(a)}
      ${a.releases && a.releases.length ? ` · <button class="link" data-news="${a.id}">What's new</button>` : ""}</div>
  </div>`;
}

function newsSheet(s) {
  const a = s.addons.find(x => x.id === news);
  if (!a) return "";
  return `<div class="modal"><div class="sheet">
    <div class="head"><img src="${s.logo}" alt="">What's new in ${esc(a.name)}</div>
    <div class="body">${a.releases.map(r => `
      <div class="rel-date">${esc(r.date)}${r.date ? " · " : ""}Version ${esc(r.version)}</div>
      <div class="rel">${r.notes.map(sec => `<h3>${esc(sec.title)}</h3>
        <ul>${sec.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</div>`).join("")}</div>
    <div class="foot"><button class="primary" data-close>Close</button></div>
  </div></div>`;
}

function versionLine(a) {
  const v = x => `<span class="ver">${esc(x)}</span>`;
  if (a.installed && a.offered && a.installed !== a.offered) return `Version ${v(a.installed)} → ${v(a.offered)}`;
  if (a.installed) return `Version ${v(a.installed)}`;
  if (a.offered && (a.has_old_build || a.state !== "current")) return `Update to ${v(a.offered)}`;
  if (a.offered) return `Version ${v(a.offered)}`;
  return "Not installed yet";
}

function lockedLine(a, s) {
  const kind = (a.unlock && a.unlock.kind) || "locked";
  const right = kind === "signin" ? `<button class="chip-btn" data-act="sign_in">Sign in</button>`
    : `<span class="pill dim">${esc({guild: "Members only", coming: "Coming later", update: "Update the app", purchase: "Locked"}[kind] || "Locked")}</span>`;
  return `<div class="line">${mark(a, s, true)}
    <div class="grow">${esc(a.name)}</div>${right}</div>`;
}

function mainView(s) {
  const available = s.addons.filter(a => a.available), locked = s.addons.filter(a => !a.available);
  return `<main>
    ${s.signin.error ? `<div class="error">${esc(s.signin.error)}</div>` : ""}
    ${(s.notices || []).map(n => `<div class="note gold">${esc(n.text)}
      <button class="link" data-act="dismiss_notice" data-id="${n.id}">OK</button></div>`).join("")}
    ${[...new Set(s.addons.map(a => a.game || "Other"))].map(game => {
       const here = a => (a.game || "Other") === game;
       return available.filter(here).map(a => card(a, s)).join("");
     }).join("")}
    ${locked.length ? `<div>${locked.map(a => lockedLine(a, s)).join("")}</div>` : ""}
  </main>${footer(s)}${news ? newsSheet(s) : ""}`;
}

function options(s) {
  return `<main><div class="opts">
    ${(s.clients || []).map(c => `<div class="opt"><div class="label">${esc(c.title)} folder</div>
      <div class="path">${esc(c.path || "Not found")}</div>
      ${c.problem ? `<div class="note">${esc(c.problem)}</div>` : ""}
      ${c.newer ? `<div class="small" style="margin-top:4px">A newer ${esc(c.title)} client is at ${esc(c.newer)}. XPCompass keeps installing into the folder you chose.
        <button class="link" data-act="use_found_client" data-id="${c.id}">Use the newer one</button></div>` : ""}
      <div style="margin-top:6px"><button data-act="pick_game" data-id="${c.id}">Change</button>
        ${c.path ? `<button data-act="open_addons" data-id="${c.id}">Open AddOns</button>` : ""}
        ${c.chosen ? `<button class="link" data-act="use_found_client" data-id="${c.id}">Find it automatically</button>` : ""}</div></div>`).join("")}
    <div class="opt"><label class="check"><input type="checkbox" data-act="toggle_start" ${s.start_with_windows ? "checked" : ""}>
      ${esc(s.login_label || "Start with Windows")}</label></div>
    <div class="opt small"><button class="link" data-act="open_privacy">Privacy Policy</button>${s.uploaded ? ` · ${esc(s.uploaded)}` : ""}</div>
    ${s.signed_in ? `<div class="opt"><button class="link" data-act="sign_out">Sign out</button></div>` : ""}
    <div class="small">Every part arrives in one download; switch parts on or off in the game's AddOns list.
      If you stop using XPCompass, its folders stay in AddOns until you delete them.
      · <button class="link" data-view="about">About</button></div>
  </div></main>`;
}

// The About view's last line (window.PRIVACY_LINE), its two policy names as links to their pages.
function privacyLine(line) {
  return esc(line)
    .replace("Privacy Policy", `<button class="link" data-act="open_privacy">Privacy Policy</button>`)
    .replace("Terms of Use", `<button class="link" data-act="open_terms">Terms of Use</button>`);
}

function about(s) {
  const parts = s.addons.filter(a => a.installed || a.offered).map(a =>
    `<div>${esc(a.name)}: ${versionLine(a)}</div>`).join("");
  return `<main><div class="opts">
    <div class="opt"><div class="label">About XPCompass</div>
      <div>App <span class="ver">${esc(s.version)}</span></div>${parts}</div>
    <div><button class="link" data-view="options">Back to Options</button></div>
    <div class="small">${privacyLine(s.privacy_line)}</div>
  </div></main>`;
}

function footer(s) {
  const busy = s.addons.find(a => a.state === "downloading" || a.state === "installing") || (s.app_update && {name: "XPCompass", ...s.app_update});
  let text, bar = "";
  if (busy) {
    const pct = busy.progress == null ? null : Math.round(busy.progress * 100);
    text = `${busy.state === "installing" ? "Installing" : "Downloading"}${pct == null ? "…" : ` ${pct}%`}`;
    bar = `<div class="bar ${pct == null ? "busy" : ""}"><div style="width:${pct || 0}%"></div></div>`;
  } else if (s.checking) {
    text = "Checking for updates…";
  } else {
    text = (s.addons.some(a => a.state === "waiting") ? "Update ready" : "Up to date") + (s.checked ? ` · checked ${esc(s.checked)}` : "");
  }
  return `<footer><div class="text">${text}</div>${bar}
    <button class="link" data-act="check_now">Check now</button></footer>`;
}

function welcome(s) {
  return `<div class="centre"><div>
    <img src="${s.logo}" alt="" style="width:52px;height:52px">
    <h1>Keep your guides up to date</h1>
    <p>Sign in with Discord to start. Only Bans members get every guide.</p>
    ${s.signin.error ? `<p class="error">${esc(s.signin.error)}</p>` : ""}
    <button class="primary" data-act="sign_in">Sign in with Discord</button>
    <p class="small" style="margin:12px 0 6px">Opens in your browser. XPCompass never sees your password.</p>
  </div></div>`;
}

function waiting() {
  return `<div class="centre"><div>
    <h1>Waiting for Discord…</h1>
    <p>Approve XPCompass in your browser, then come back.</p>
    <button data-act="reopen_signin">Open the page again</button>
    <p style="margin-top:14px"><button class="link" data-act="cancel_signin">Cancel</button></p>
  </div></div>`;
}

function render(s) {
  const body = s.signin.busy ? waiting() : s.welcome ? welcome(s) : view === "options" ? options(s) : view === "about" ? about(s) : mainView(s);
  document.getElementById("app").innerHTML = header(s) + body;
}

async function refresh() {
  try {
    const s = await window.pywebview.api.state();
    const text = JSON.stringify(s) + view + news;
    if (text !== last) { last = text; render(s); }
  } catch (e) { /* the app is busy; try again next tick */ }
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-view]");
  if (tab) { view = tab.dataset.view; last = ""; refresh(); return; }
  const opener = e.target.closest("[data-news]");
  if (opener) { news = opener.dataset.news; last = ""; refresh(); return; }
  if (e.target.closest("[data-close]") || e.target.classList.contains("modal")) { news = null; last = ""; refresh(); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "set_wanted") window.pywebview.api.set_wanted(el.dataset.id, el.dataset.on === "1");
  else if (act === "update_now") window.pywebview.api.update_now(el.dataset.id);
  else if (act === "toggle_start") window.pywebview.api.toggle_start(el.checked);
  else window.pywebview.api[act](...(el.dataset.id ? [el.dataset.id] : []));
  setTimeout(refresh, 150);
});
window.addEventListener("pywebviewready", () => { refresh(); setInterval(refresh, 500); });
</script>
</body>
</html>
